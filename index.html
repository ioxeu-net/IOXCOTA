<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IOXCOTA | Motor de Busca de Hardware</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 900: '#0B1120', 800: '#151E32', 700: '#1E293B' },
                        gold: { 400: '#FBBF24', 500: '#F59E0B' },
                        cyan: { 400: '#22D3EE' },
                        purple: { 500: '#8B5CF6' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500&display=swap');
        body { background-color: #0B1120; color: #F8FAFC; }
        .glow-gold { box-shadow: 0 0 20px rgba(251, 191, 36, 0.1); }
        .glow-cyan { box-shadow: 0 0 20px rgba(34, 211, 238, 0.1); }
        input:focus { outline: none; box-shadow: 0 0 0 2px #FBBF24; }
    </style>
</head>
<body class="min-h-screen font-sans antialiased flex flex-col items-center justify-center p-4">

    <div class="w-full max-w-4xl space-y-8 animate-in fade-in duration-700">
        
        <!-- CABEÇALHO -->
        <header class="text-center space-y-4">
            <div class="inline-flex items-center justify-center p-4 bg-navy-800 rounded-full border border-gold-400/30 glow-gold mb-2">
                <i data-lucide="search" class="h-10 w-10 text-gold-400"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-black tracking-tight text-white">
                IOXCOTA <span class="text-gold-400">SEARCH</span>
            </h1>
            <p class="text-slate-400 text-lg max-w-xl mx-auto">
                Motor de busca multiloja. Encontre o melhor preço em Kabum, Pichau, Terabyte e Amazon sem intermediários.
            </p>
        </header>

        <!-- ÁREA DE BUSCA PRINCIPAL -->
        <section class="bg-navy-800 border border-navy-700 rounded-3xl p-8 shadow-2xl glow-cyan relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-purple-500 via-gold-400 to-cyan-400"></div>
            
            <div class="flex flex-col md:flex-row gap-4">
                <div class="relative flex-1">
                    <i data-lucide="cpu" class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-500"></i>
                    <input type="text" id="search-input" placeholder="Ex: RTX 4060, Ryzen 5 5600, SSD 1TB..." 
                           class="w-full bg-navy-900 border border-navy-700 text-white text-lg pl-12 pr-4 py-4 rounded-xl focus:border-gold-400 transition placeholder-slate-600">
                </div>
                <button onclick="performSearch()" 
                        class="bg-gold-400 hover:bg-gold-500 text-navy-900 font-black text-lg px-8 py-4 rounded-xl transition flex items-center justify-center gap-2 shadow-lg shadow-gold-400/20">
                    <i data-lucide="zap" class="h-5 w-5"></i> BUSCAR PREÇOS
                </button>
            </div>

            <!-- FILTROS RÁPIDOS (Opcional) -->
            <div class="mt-6 flex flex-wrap gap-2 justify-center">
                <button onclick="quickSearch('Placa de Vídeo')" class="px-3 py-1 bg-navy-900 border border-navy-700 rounded-lg text-xs text-slate-400 hover:text-gold-400 hover:border-gold-400/50 transition">Placas de Vídeo</button>
                <button onclick="quickSearch('Processador AMD')" class="px-3 py-1 bg-navy-900 border border-navy-700 rounded-lg text-xs text-slate-400 hover:text-gold-400 hover:border-gold-400/50 transition">Processadores AMD</button>
                <button onclick="quickSearch('Memória RAM DDR4')" class="px-3 py-1 bg-navy-900 border border-navy-700 rounded-lg text-xs text-slate-400 hover:text-gold-400 hover:border-gold-400/50 transition">Memórias RAM</button>
                <button onclick="quickSearch('Fonte 650W')" class="px-3 py-1 bg-navy-900 border border-navy-700 rounded-lg text-xs text-slate-400 hover:text-gold-400 hover:border-gold-400/50 transition">Fontes</button>
            </div>
        </section>

        <!-- RESULTADOS / LOJAS -->
        <section id="results-area" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 hidden">
            <!-- Cards de lojas serão injetados aqui -->
        </section>

        <!-- RODAPÉ -->
        <footer class="text-center text-xs text-slate-600 pt-8">
            <p>IOXCOTA v4.0 • Sem Afiliados • Busca Real • Powered by Cloudflare Workers (Em Breve)</p>
        </footer>

    </div>

    <script>
        // --- CONFIGURAÇÃO DE BUSCA REAL (SEM AFILIADOS) ---
        const STORES = [
            { name: "Kabum", color: "bg-orange-500", urlBase: "https://www.kabum.com.br/cgi-bin/site/busca?q=", icon: "shopping-cart" },
            { name: "Pichau", color: "bg-blue-600", urlBase: "https://www.pichau.com.br/catalogsearch/result/?q=", icon: "monitor" },
            { name: "Terabyte", color: "bg-red-600", urlBase: "https://www.terabyteshop.com.br/busca?str=", icon: "hard-drive" },
            { name: "Amazon", color: "bg-yellow-500", urlBase: "https://www.amazon.com.br/s?k=", icon: "package" },
            { name: "Mercado Livre", color: "bg-yellow-400", urlBase: "https://lista.mercadolivre.com.br/", icon: "hand" },
            { name: "AliExpress", color: "bg-red-500", urlBase: "https://pt.aliexpress.com/wholesale?SearchText=", icon: "globe" }
        ];

        function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            
            const resultsArea = document.getElementById('results-area');
            resultsArea.innerHTML = '';
            resultsArea.classList.remove('hidden');

            // Gera cards para cada loja com o link de busca correto
            STORES.forEach(store => {
                const searchUrl = store.urlBase + encodeURIComponent(query);
                
                const card = document.createElement('a');
                card.href = searchUrl;
                card.target = "_blank";
                card.className = "group bg-navy-800 border border-navy-700 hover:border-gold-400/50 rounded-2xl p-6 flex items-center gap-4 transition-all hover:-translate-y-1 hover:shadow-lg hover:shadow-gold-400/10 cursor-pointer";
                
                card.innerHTML = `
                    <div class="h-12 w-12 rounded-xl ${store.color} flex items-center justify-center text-white shadow-lg group-hover:scale-110 transition-transform">
                        <i data-lucide="${store.icon}" class="h-6 w-6"></i>
                    </div>
                    <div class="flex-1">
                        <h3 class="font-bold text-white text-lg group-hover:text-gold-400 transition-colors">Buscar no ${store.name}</h3>
                        <p class="text-xs text-slate-400 truncate">"${query}"</p>
                    </div>
                    <i data-lucide="external-link" class="h-5 w-5 text-slate-600 group-hover:text-gold-400 transition-colors"></i>
                `;
                
                resultsArea.appendChild(card);
            });

            lucide.createIcons();
        }

        function quickSearch(term) {
            document.getElementById('search-input').value = term;
            performSearch();
        }

        // Permite buscar apertando Enter
        document.getElementById('search-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') performSearch();
        });

        // Inicializa ícones
        lucide.createIcons();
    </script>
</body>
</html>
